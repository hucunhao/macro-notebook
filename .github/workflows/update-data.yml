# 每天自动更新 data/，提交到 main，然后请 GitHub Pages 重新发布。
# 只用工作流自带的 GITHUB_TOKEN（权限见下方 permissions），不需要任何 secret 或仓库变量。
name: 每日更新数据

on:
  schedule:
    - cron: '30 22 * * 1-5'   # UTC 22:30（周一到周五）= 台北时间次日 06:30，美股收盘之后
  workflow_dispatch: {}        # Actions 页面上的 “Run workflow” 按钮，手动跑一次

permissions:
  contents: write   # 提交并推送 data/
  pages: write      # 调用 “Request a GitHub Pages build” 接口

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  TZ: Asia/Taipei
  MS_CONTACT: hch@mail.grokbot.com   # 写进 SEC / 维基百科请求头的联系邮箱（它们要求留联系方式）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # raw/ 是下载缓存：某个来源当天抓取失败时，脚本沿用上次的文件。
      # 缓存放在 Actions cache 里，不提交进仓库（成分股原始数据约 50MB）。
      - name: 取回上次的下载缓存
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 建好 raw/ 子文件夹
        run: mkdir -p raw/fred raw/treasury raw/other raw/nasdaq raw/cnn raw/sp500 raw/em raw/cal raw/earnings raw/qdii

      # 这一步也会跑 extra_data.py（全球股指、商品汇率、经济日历、财报日历、QDII 溢价）。
      # 扩展数据每一块单独容错：东方财富等来源连不上时沿用缓存/上一版文件，不会让这一步失败。
      - name: 抓取宏观序列并重建 data/
        env:
          MS_QC_DIR: ${{ runner.temp }}/quant_course   # 课程结果 markdown 写到临时目录，不进仓库
        run: python3 update_data.py

      - name: 抓取标普 500 成分股（热力图、广度、估值、同业）
        run: python3 constituents.py
        timeout-minutes: 40
        continue-on-error: true   # 失败时 data/sp500* 保持上一版，其它数据照常更新

      - name: 保存下载缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}

      - name: 质量检查（有来源缺失就不提交，避免把残缺数据发布出去）
        run: |
          python3 - <<'PY'
          import json, sys
          st = json.load(open('data/series.json'))['meta']['status']
          bad = {k: v for k, v in st.items() if v == 'missing'}
          print('来源状态：', {v: sum(1 for x in st.values() if x == v) for v in set(st.values())})
          if bad:
              print('缺失：', bad); sys.exit(1)
          PY

      - name: 提交并推送
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有变化"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "数据更新 $(date +%Y-%m-%d)"
          git fetch --depth=50 origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # 用 GITHUB_TOKEN 推送的提交不会触发 Pages 的自动构建（GitHub 文档明确写了），
      # 所以这里显式请求一次构建。仅适用于 Pages 来源 = “Deploy from a branch”（build_type = legacy）。
      - name: 让 GitHub Pages 重新发布
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          echo "Pages build_type: $bt"
          if [ "$bt" = "legacy" ]; then
            gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
          else
            echo "::warning::Pages 来源不是 “Deploy from a branch”（build_type=$bt），这一步没有触发发布。"
          fi
